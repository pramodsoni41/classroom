<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" onload="initGoogleSignIn()" defer></script>

  <style>
    .google-btn-wrap {
      display: flex;
      justify-content: center;
      margin: 8px 0 4px;
    }

    .roll-toggle {
      background: none;
      border: none;
      color: #2563eb;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      width: auto;
      text-decoration: underline;
      margin-top: 6px;
    }

    .roll-toggle:hover {
      color: #1d4ed8;
      background: none;
    }

    #rollSection {
      display: none;
      margin-top: 14px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .close-btn {
      float: right;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>

<body class="login-page">

<div class="login-card">
  <h1>Student Portal</h1>
  <p class="subtitle">Login to view notes, marks and attendance</p>

  <!-- Google Sign-In Button -->
  <div class="google-btn-wrap">
    <div id="googleSignInBtn"></div>
  </div>

  <p id="loginMessage"></p>

  <button onclick="openModal()" class="quiz-btn">
    Change Password
  </button>
</div>

<!-- Change Password Modal -->
<div id="changeModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h3>Change Password</h3>
    <input type="text" id="rollChange" placeholder="Roll Number">
    <input type="password" id="oldPass" placeholder="Old Password">
    <input type="password" id="newPass" placeholder="New Password">
    <button onclick="changePasswordFromLogin()">Update Password</button>
    <p id="changeMessage"></p>
  </div>
</div>

<script src="script.js"></script>

<script>
  function openModal() {
    document.getElementById("changeModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("changeModal").style.display = "none";
  }

  function toggleRollSection() {
    const sec = document.getElementById("rollSection");
    const btn = document.querySelector(".roll-toggle");
    const visible = sec.style.display === "block";
    sec.style.display = visible ? "none" : "block";
    btn.textContent = visible ? "Use Roll Number instead" : "Hide Roll Number login";
  }

  window.onclick = function(e) {
    let modal = document.getElementById("changeModal");
    if (e.target === modal) modal.style.display = "none";
  };

  function initGoogleSignIn() {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredential,
      auto_select: false
    });
    google.accounts.id.renderButton(
      document.getElementById("googleSignInBtn"),
      { theme: "outline", size: "large", width: 300, text: "signin_with" }
    );
  }
</script>

</body>
</html>
